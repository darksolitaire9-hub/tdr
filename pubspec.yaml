name: todo_app
description: Local-first Android todo app — Flutter 3.x, Material 3, Drift, Riverpod.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Local database (SQLite, local-first)
  drift: ^2.22.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24

  # Immutable domain models
  freezed_annotation: ^3.1.0

  # Navigation
  go_router: ^14.6.3

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.1.1

  # Audio
  audioplayers: ^6.1.0

  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
